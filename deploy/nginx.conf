# devnel.com on Linux with Nginx. See README → Deploying.
#
# Nginx serves the static build (dist/client) itself and proxies only /api/
# to the Astro Node server (npm start on 127.0.0.1:4321). The app's .env must
# set CLIENT_IP_HEADER=x-forwarded-for (or x-real-ip) so rate limiting sees
# real visitors. TLS certificates here assume certbot; adjust paths to suit.

server {
    listen 80;
    listen [::]:80;
    server_name devnel.com www.devnel.com;
    return 301 https://devnel.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.devnel.com;
    ssl_certificate     /etc/letsencrypt/live/devnel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devnel.com/privkey.pem;
    return 301 https://devnel.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name devnel.com;
    ssl_certificate     /etc/letsencrypt/live/devnel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devnel.com/privkey.pem;

    root /srv/devnel-com/dist/client;
    server_tokens off;
    # Relative Location headers: correct whatever port or scheme sits in front.
    absolute_redirect off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Shared security headers. Nginx drops inherited add_header lines in any
    # block that sets its own, so blocks below include this file again.
    include /etc/nginx/snippets/devnel-security-headers.conf;
    # /etc/nginx/snippets/devnel-security-headers.conf contains:
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #   add_header X-Content-Type-Options "nosniff" always;
    #   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    #   add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    #   add_header X-Frame-Options "DENY" always;
    #   add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # The contact endpoint: the only dynamic route.
    location /api/ {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cloudflare/Netlify config, not content.
    location = /_headers { return 404; }

    location /_astro/ {
        include /etc/nginx/snippets/devnel-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /resume.json {
        include /etc/nginx/snippets/devnel-security-headers.conf;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        include /etc/nginx/snippets/devnel-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        # /about → /about/ (trailingSlash is 'always'); built as /about/index.html.
        if (-f $request_filename/index.html) {
            rewrite ^(.*[^/])$ $1/ permanent;
        }
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
